name: Sincronizar Projetos do GitHub

on:
  schedule:
    # Executa toda segunda-feira às 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Rodar script de atualização
        run: python scripts/update_projects.py

      - name: Salvar alterações no repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add projects.json
          git commit -m "Auto: novos projetos adicionados via GitHub Actions [skip ci]" || exit 0
          git push
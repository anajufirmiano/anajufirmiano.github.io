name: Sincronizar Projetos do GitHub

on:
  schedule:
    # Executa todas as quartas-feiras às 11:00 UTC (08:00 no horário de Brasília)
    - cron: '0 11 * * 3'
  workflow_dispatch: # Permite executar manualmente a qualquer momento pelo botão

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install requests

      - name: Rodar script de atualização
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_projects.py

      - name: Salvar alterações no repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add projects.json
          git commit -m "Auto: novos projetos adicionados via GitHub Actions [skip ci]" || exit 0
          git push
